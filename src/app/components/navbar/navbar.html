<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()" aria-label="Santhosh Kumar home">
      <span>Santhosh Kumar</span>
    </a>

    <nav class="desktop-nav" aria-label="Primary navigation">
      <a href="#about">About</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Work</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="linkedin-link" href="https://www.linkedin.com/in/santhosh-kumar-523b061a1/" target="_blank" rel="noopener">LinkedIn <span aria-hidden="true">↗</span></a>
    <div class="theme-switcher" role="group" aria-label="Color theme">
      <button type="button" [class.active]="activeTheme() === 'warm'" (click)="setTheme('warm')" aria-label="Use warm theme"></button>
      <button type="button" [class.active]="activeTheme() === 'midnight'" (click)="setTheme('midnight')" aria-label="Use midnight theme"></button>
      <button type="button" [class.active]="activeTheme() === 'ocean'" (click)="setTheme('ocean')" aria-label="Use ocean theme"></button>
    </div>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="mobile-navigation" aria-label="Toggle navigation menu">
      <span></span><span></span>
    </button>
  </div>

  @if (menuOpen()) {
    <nav class="mobile-nav" id="mobile-navigation" aria-label="Mobile navigation">
      <a href="#about" (click)="closeMenu()">About <span>01</span></a>
      <a href="#experience" (click)="closeMenu()">Experience <span>02</span></a>
      <a href="#projects" (click)="closeMenu()">Work <span>03</span></a>
      <a href="#contact" (click)="closeMenu()">Contact <span>04</span></a>
    </nav>
  }
</header>
